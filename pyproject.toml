[project]
name = "meetingrec"
version = "0.1.0"
description = "Local meeting recorder + transcriber + Claude summarizer (German-first)"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Jonas Tüchler" },
]
dependencies = [
    "faster-whisper>=1.2.0",
    "click>=8.1.0",
    "huggingface-hub>=0.27.0",
    "transformers>=4.40.0",
]

[project.scripts]
meetingrec = "meetingrec:cli"

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["meetingrec"]
