[project]
name = "meetingrec"
version = "0.2.0"
description = "Local meeting recorder for Linux: synced mic, system audio and screen capture, Whisper transcription, speaker diarization and naming, Claude-written minutes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Jonas Tüchler" },
]
dependencies = [
    "click>=8.1.0",
    "faster-whisper>=1.2.1",
    "jeepney>=0.9.0",
]

[project.optional-dependencies]
diarize = []

[project.scripts]
meetingrec = "meetingrec.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
